name: Weekly SEO Audit

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 1. Uptime & response times ──────────────────────────────────────────
      - name: Uptime checks
        run: |
          DATE=$(date +%Y-%m-%d)
          {
            echo "# HowAutomate Weekly SEO Report — $DATE"
            echo ""
            echo "## 1. Uptime & Response Times"
            echo ""
            echo "| Page | Status | TTFB | Result |"
            echo "|---|---|---|---|"
          } > report.md

          PAGES=(
            "/"
            "/services/whatsapp-automation"
            "/services/ca-firm-automation"
            "/services/real-estate-automation"
            "/services/clinic-automation"
            "/services/ecommerce-automation"
            "/services/coaching-automation"
            "/blog"
            "/about"
            "/contact"
            "/sitemap.xml"
          )

          for page in "${PAGES[@]}"; do
            url="https://howautomate.com$page"
            read -r status ttfb < <(curl -o /dev/null -s -w "%{http_code} %{time_starttransfer}" --max-time 15 "$url")
            flag="✅ OK"
            if [ "$status" != "200" ]; then flag="🔴 HTTP $status"; fi
            if (( $(echo "$ttfb > 0.8" | bc -l) )); then flag="🟡 SLOW (${ttfb}s)"; fi
            echo "| \`$page\` | $status | ${ttfb}s | $flag |" >> report.md
          done

      # ── 2. PageSpeed Insights ───────────────────────────────────────────────
      - name: PageSpeed Insights
        run: |
          {
            echo ""
            echo "## 2. PageSpeed Insights (Mobile)"
            echo ""
          } >> report.md

          HTTP_CODE=$(curl -s -o psi.json -w "%{http_code}" \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https://howautomate.com&strategy=mobile")

          if [ "$HTTP_CODE" = "429" ]; then
            echo "> ⚠️ Daily API quota exceeded. Check manually: https://pagespeed.web.dev/?url=howautomate.com" >> report.md
          elif [ "$HTTP_CODE" = "200" ]; then
            node .github/scripts/parse-psi.js >> report.md
          else
            echo "> ⚠️ PageSpeed API returned HTTP $HTTP_CODE" >> report.md
          fi

      # ── 3. Sitemap health ───────────────────────────────────────────────────
      - name: Sitemap audit
        run: |
          {
            echo ""
            echo "## 3. Sitemap Health"
            echo ""
          } >> report.md

          curl -sf "https://howautomate.com/sitemap.xml" -o sitemap_live.xml

          if [ $? -ne 0 ]; then
            echo "> ❌ Could not fetch sitemap.xml" >> report.md
          else
            total=$(grep -c "<loc>" sitemap_live.xml || echo 0)
            blog=$(grep -c "/blog/" sitemap_live.xml || echo 0)
            portfolio=$(grep -c "/portfolio/" sitemap_live.xml || echo 0)
            services=$(grep -oP '/services/[a-z-]+' sitemap_live.xml | grep -v "^/services$" | sort -u | wc -l || echo 0)

            {
              echo "| Section | Count | Expected | Status |"
              echo "|---|---|---|---|"
            } >> report.md

            [ "$total" -ge 55 ]     && ts="✅" || ts="⚠️"
            [ "$blog" -ge 33 ]      && bs="✅" || bs="⚠️"
            [ "$portfolio" -ge 16 ] && ps="✅" || ps="⚠️"
            [ "$services" -ge 6 ]   && ss="✅" || ss="⚠️"

            echo "| Total URLs    | $total     | 55+  | $ts |" >> report.md
            echo "| Blog posts    | $blog      | 33+  | $bs |" >> report.md
            echo "| Portfolio     | $portfolio | 16+  | $ps |" >> report.md
            echo "| Service pages | $services  | 6    | $ss |" >> report.md
          fi

      # ── 4. Codebase audit + auto-fix ────────────────────────────────────────
      - name: Codebase audit and auto-fix
        id: fixes
        run: |
          {
            echo ""
            echo "## 4. Codebase SEO Audit"
            echo ""
          } >> report.md

          BRANCH="weekly-seo-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          CHANGES=0

          # Check for stale public/sitemap.xml
          if [ -f "public/sitemap.xml" ]; then
            echo "- 🚨 **CRITICAL** \`public/sitemap.xml\` found — removing" >> report.md
            git rm public/sitemap.xml
            CHANGES=$((CHANGES + 1))
          else
            echo "- ✅ No stale \`public/sitemap.xml\`" >> report.md
          fi

          # Check each service page
          echo "" >> report.md
          echo "**Service pages:**" >> report.md
          echo "" >> report.md

          for f in app/services/*/page.tsx; do
            [ -f "$f" ] || continue
            service=$(echo "$f" | sed 's|app/services/||;s|/page.tsx||')
            issues=""
            grep -q 'description:'        "$f" || issues="$issues missing-meta-description,"
            grep -q 'canonical'           "$f" || issues="$issues missing-canonical,"
            grep -q 'application/ld+json' "$f" || issues="$issues missing-schema,"

            if [ -z "$issues" ]; then
              echo "- ✅ \`$service\`: all checks pass" >> report.md
            else
              echo "- ⚠️ \`$service\`: ${issues%,}" >> report.md
            fi
          done

          # Blog post count
          post_count=$(grep -c '^  "[a-z][a-z0-9-]*": {' lib/posts.ts 2>/dev/null || echo "unknown")
          echo "" >> report.md
          echo "- 📝 Blog posts in \`lib/posts.ts\`: **$post_count**" >> report.md

          echo "CHANGES=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH"   >> "$GITHUB_OUTPUT"

      # ── 5. Open PR if fixes found ────────────────────────────────────────────
      - name: Commit and open PR
        if: steps.fixes.outputs.CHANGES != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Weekly SEO auto-fix — $(date +%Y-%m-%d)"
          git push origin "${{ steps.fixes.outputs.BRANCH }}"
          REPORT=$(cat report.md)
          gh pr create \
            --title "Weekly SEO fixes — $(date +%Y-%m-%d)" \
            --body "$REPORT

---
*Auto-generated by Weekly SEO Audit workflow*" \
            --base master \
            --head "${{ steps.fixes.outputs.BRANCH }}"

      # ── 6. Create weekly GitHub Issue ────────────────────────────────────────
      - name: Ensure weekly-seo label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "weekly-seo" --color "0075ca" --description "Weekly SEO audit report" 2>/dev/null || true

      - name: Close previous audit issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'weekly-seo',
              state: 'open'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Create weekly audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: '📊 Weekly SEO Audit — ' + new Date().toISOString().split('T')[0],
              body:  report + '\n\n---\n*Auto-generated by [Weekly SEO Audit](.github/workflows/weekly-seo-audit.yml)*',
              labels: ['weekly-seo']
            });
