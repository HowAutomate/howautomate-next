name: Weekly SEO Audit

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 1. Uptime ─────────────────────────────────────────────────────────────
      - name: Uptime checks
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "# HowAutomate Weekly SEO Report — $DATE" > report.md
          echo "" >> report.md
          echo "## 1. Uptime & Response Times" >> report.md
          echo "" >> report.md
          echo "| Page | Status | TTFB |" >> report.md
          echo "|---|---|---|" >> report.md

          for page in "/" "/services/whatsapp-automation" "/services/ca-firm-automation" \
                      "/services/real-estate-automation" "/services/clinic-automation" \
                      "/services/ecommerce-automation" "/services/coaching-automation" \
                      "/blog" "/about" "/contact" "/sitemap.xml"; do
            url="https://howautomate.com${page}"
            result=$(curl -o /dev/null -s -w "%{http_code} %{time_starttransfer}" --max-time 15 "$url" || echo "ERR 0")
            status=$(echo "$result" | awk '{print $1}')
            ttfb=$(echo "$result" | awk '{print $2}')
            if [ "$status" = "200" ]; then
              flag="✅"
            else
              flag="🔴 $status"
            fi
            echo "| \`${page}\` | $flag | ${ttfb}s |" >> report.md
          done

      # ── 2. PageSpeed ─────────────────────────────────────────────────────────
      - name: PageSpeed Insights
        run: |
          echo "" >> report.md
          echo "## 2. PageSpeed Insights (Mobile)" >> report.md
          echo "" >> report.md

          HTTP_CODE=$(curl -s -o psi.json -w "%{http_code}" \
            "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https://howautomate.com&strategy=mobile" || echo "000")

          if [ "$HTTP_CODE" = "429" ]; then
            echo "> ⚠️ API quota exceeded. Check manually: https://pagespeed.web.dev/?url=howautomate.com" >> report.md
          elif [ "$HTTP_CODE" = "200" ]; then
            node .github/scripts/parse-psi.js >> report.md || echo "> ⚠️ Could not parse PageSpeed response" >> report.md
          else
            echo "> ⚠️ PageSpeed API returned HTTP $HTTP_CODE" >> report.md
          fi

      # ── 3. Sitemap ────────────────────────────────────────────────────────────
      - name: Sitemap audit
        run: |
          echo "" >> report.md
          echo "## 3. Sitemap Health" >> report.md
          echo "" >> report.md

          if curl -sf "https://howautomate.com/sitemap.xml" -o sitemap_live.xml; then
            total=$(grep -c "<loc>" sitemap_live.xml || echo 0)
            blog=$(grep -c "/blog/" sitemap_live.xml || echo 0)
            portfolio=$(grep -c "/portfolio/" sitemap_live.xml || echo 0)
            services=$(grep -oP '/services/[a-z-]+' sitemap_live.xml | grep -v "^/services$" | sort -u | wc -l || echo 0)

            echo "| Section | Count | Expected | Status |" >> report.md
            echo "|---|---|---|---|" >> report.md

            [ "$total" -ge 65 ]     && ts="✅" || ts="⚠️"
            [ "$blog" -ge 38 ]      && bs="✅" || bs="⚠️"
            [ "$portfolio" -ge 16 ] && ps="✅" || ps="⚠️"
            [ "$services" -ge 6 ]   && ss="✅" || ss="⚠️"

            echo "| Total URLs    | $total     | 65+  | $ts |" >> report.md
            echo "| Blog posts    | $blog      | 38+  | $bs |" >> report.md
            echo "| Portfolio     | $portfolio | 16+  | $ps |" >> report.md
            echo "| Service pages | $services  | 6    | $ss |" >> report.md
          else
            echo "> ❌ Could not fetch sitemap.xml" >> report.md
          fi

      - name: IndexNow ping (Bing / Yandex)
        run: |
          echo "" >> report.md
          echo "## 3b. IndexNow Submission" >> report.md
          echo "" >> report.md
          KEY="${INDEXNOW_KEY:-howautomateindexnow8f3c2b1a4d5e6f}"
          if [ -f sitemap_live.xml ]; then
            urls_json=$(grep -oP '(?<=<loc>)[^<]+' sitemap_live.xml | jq -R . | jq -s .)
            count=$(echo "$urls_json" | jq 'length')
            payload=$(jq -n --argjson urls "$urls_json" --arg key "$KEY" \
              '{host:"howautomate.com", key:$key, keyLocation:("https://howautomate.com/"+$key+".txt"), urlList:$urls}')
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" -d "$payload")
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then
              echo "> ✅ Submitted **$count** URLs to IndexNow (HTTP $code) — Bing & Yandex notified." >> report.md
            else
              echo "> ⚠️ IndexNow returned HTTP $code for $count URLs." >> report.md
            fi
          else
            echo "> ⚠️ Skipped — sitemap_live.xml not available." >> report.md
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      # ── 4. Codebase audit + auto-fix ─────────────────────────────────────────
      - name: Codebase audit and auto-fix
        id: fixes
        run: |
          echo "" >> report.md
          echo "## 4. Codebase SEO Audit" >> report.md
          echo "" >> report.md

          BRANCH="weekly-seo-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          CHANGES=0

          # Stale public/sitemap.xml
          if [ -f "public/sitemap.xml" ]; then
            echo "- 🚨 \`public/sitemap.xml\` found — removing (overrides dynamic sitemap)" >> report.md
            git rm public/sitemap.xml
            CHANGES=$((CHANGES + 1))
          else
            echo "- ✅ No stale \`public/sitemap.xml\`" >> report.md
          fi

          # Service pages
          echo "" >> report.md
          echo "**Service pages:**" >> report.md
          echo "" >> report.md

          for f in app/services/*/page.tsx; do
            [ -f "$f" ] || continue
            service=$(echo "$f" | sed 's|app/services/||;s|/page.tsx||')
            issues=""
            grep -q 'description:'        "$f" || issues="${issues}missing-meta-description "
            grep -q 'canonical'           "$f" || issues="${issues}missing-canonical "
            grep -q 'application/ld+json' "$f" || issues="${issues}missing-schema "

            if [ -z "$issues" ]; then
              echo "- ✅ \`$service\`: all checks pass" >> report.md
            else
              echo "- ⚠️ \`$service\`: $issues" >> report.md
            fi
          done

          # Blog post count
          post_count=$(grep -c '^  "[a-z][a-z0-9-]*": {' lib/posts.ts 2>/dev/null || echo 0)
          echo "" >> report.md
          echo "- 📝 Blog posts in \`lib/posts.ts\`: **$post_count**" >> report.md

          echo "CHANGES=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH"   >> "$GITHUB_OUTPUT"

      # ── 5. PR if fixes exist ──────────────────────────────────────────────────
      - name: Commit and open PR
        if: steps.fixes.outputs.CHANGES != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Weekly SEO auto-fix — $(date +%Y-%m-%d)"
          git push origin "${{ steps.fixes.outputs.BRANCH }}"
          gh pr create \
            --title "Weekly SEO fixes — $(date +%Y-%m-%d)" \
            --body "$(cat report.md)" \
            --base master \
            --head "${{ steps.fixes.outputs.BRANCH }}"

      # ── 6. Weekly Issue ───────────────────────────────────────────────────────
      - name: Ensure weekly-seo label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "weekly-seo" --color "0075ca" --description "Weekly SEO audit" 2>/dev/null || true

      - name: Close previous audit issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'weekly-seo', state: 'open'
            });
            for (const i of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }

      - name: Create weekly audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '📊 Weekly SEO Audit — ' + new Date().toISOString().split('T')[0],
              body: report + '\n\n---\n*Auto-generated by [Weekly SEO Audit](.github/workflows/weekly-seo-audit.yml)*',
              labels: ['weekly-seo']
            });
